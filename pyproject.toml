[project]
name = "odsc-west-2026"
version = "0.1.0"
description = "HDC + graph tutorial companion for ODSC West 2026"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "lance-graph==0.5.4",
    "lancedb==0.33.0",
    "pyarrow>=18,<25",
    "torch==2.6.0",
    "torch-hd==5.8.4",
]

[dependency-groups]
dev = [
    "nbclient>=0.10,<1",
    "pytest>=8,<10",
]
